name: Temporary build check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Build site
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production
      - name: Show generated pages
        run: |
          find _site -maxdepth 2 -type f | sort
          echo "----- ABOUT PAGE -----"
          cat _site/index.html
          echo "----- PUBLICATIONS PAGE -----"
          cat _site/publications/index.html
