name: Temporary build check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Build site
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production
      - name: Check published pages
        run: |
          find _site -maxdepth 2 -type f | sort
          test -f _site/index.html
          test -f _site/publications/index.html
          test ! -e _site/talkmap
          test ! -e _site/cv
          test ! -e _site/talks
          test ! -e _site/teaching
          test ! -e _site/portfolio
          echo "Only the About and Publications pages are published."
